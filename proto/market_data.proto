syntax = "proto3";

package market_data;

option go_package = "./market_data";

// Standard Market Tick
message Tick {
    string instrument_token = 1;
    double last_price = 2;
    double volume = 3;
    int64 timestamp = 4; // Unix nanoseconds
    double bid = 5;
    double ask = 6;
}

// OHLC Bar
message Bar {
    string symbol = 1;
    double open = 2;
    double high = 3;
    double low = 4;
    double close = 5;
    double volume = 6;
    int64 start_time = 7;
    int64 end_time = 8;
}

// Batch of Ticks for High-Throughput transfer
message TickBatch {
    repeated Tick ticks = 1;
}
